<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>HomeKit Glass – IoT</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- CSS riêng -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Các giọt nước trang trí -->
    <div class="water-drop drop1"></div>
    <div class="water-drop drop2"></div>
    <div class="water-drop drop3"></div>
    <div class="water-drop drop4"></div>
    <div class="water-drop drop5"></div>

    <div class="app-container" id="appContainer">
        <!-- Header -->
        <header class="header">
            <h1>Nhà của tôi</h1>
            <div class="header-actions">
                <i class="fas fa-image" id="changeBgBtn" title="Đổi hình nền"></i>
                <i class="fas fa-user-circle"></i>
            </div>
        </header>

        <!-- Khu vực vòng tròn nhiệt độ -->
        <section class="temperature-section">
            <h2 class="section-title">Nhiệt độ</h2>
            <div class="circle-grid" id="circleGrid">
                <!-- 5 vòng tròn sẽ được tạo bởi JavaScript -->
            </div>
        </section>

        <!-- Các phòng (button) -->
        <section class="rooms-section">
            <h2 class="section-title">Phòng</h2>
            <div class="room-grid" id="roomGrid">
                <button class="room-btn" data-room="phong-ngu-1">Phòng ngủ 1</button>
                <button class="room-btn" data-room="phong-ngu-2">Phòng ngủ 2</button>
                <button class="room-btn" data-room="phong-trung-tam">Phòng trung tâm</button>
                <button class="room-btn" data-room="phong-khach">Phòng khách</button>
            </div>
        </section>

        <!-- Khu vực hiển thị thiết bị theo phòng -->
        <section class="devices-section" id="devicesSection">
            <h2 class="section-title" id="roomTitle">Chọn một phòng</h2>
            <div class="device-grid" id="deviceGrid">
                <!-- Các thiết bị sẽ được render bởi JS -->
            </div>
        </section>

        <footer class="footer-note">
            <i class="fas fa-home"></i> &nbsp; HomeKit Glass &bull; IoT
        </footer>
    </div>

    <!-- Bottom Floating Dock -->
    <div class="bottom-dock" id="bottomDock">
        <div class="dock-items">
            <button class="dock-item active" data-tab="home"><i class="fas fa-home"></i><span>Trang chủ</span></button>
            <button class="dock-item" data-tab="scenes"><i class="fas fa-magic"></i><span>Kịch bản</span></button>
            <button class="dock-item" id="voiceBtn"><i class="fas fa-microphone"></i><span>Trợ lý</span></button>
            <button class="dock-item" data-tab="settings"><i class="fas fa-cog"></i><span>Cài đặt</span></button>
        </div>
        <!-- Chỉ báo giọt nước (blob) -->
        <div class="dock-indicator" id="dockIndicator"></div>
    </div>

    <!-- Voice Assistant Wave (hiện khi bấm micro) -->
    <div class="voice-wave" id="voiceWave">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
    </div>

    <!-- File input ẩn để đổi hình nền -->
    <input type="file" id="bgInput" accept="image/*" style="display:none;" />

    <!-- ====== PANEL CÀI ĐẶT (Settings) ====== -->
    <div class="settings-overlay" id="settingsOverlay" style="display:none;">
        <div class="settings-panel">
            <div class="settings-header">
                <h2><i class="fas fa-cog"></i> Cài đặt</h2>
                <button class="settings-close" id="settingsClose">&times;</button>
            </div>
            <div class="settings-body">
                <!-- Nhóm GIAO DIỆN -->
                <div class="settings-group">
                    <div class="group-title">GIAO DIỆN</div>
                    <!-- Chủ đề màu -->
                    <div class="setting-item">
                        <div class="setting-icon"><i class="fas fa-palette"></i></div>
                        <div class="setting-content">
                            <label>Chủ đề màu</label>
                            <div class="color-presets">
                                <button class="color-preset" style="background:#00f2fe;" data-color="#00f2fe" title="Cyan Neon"></button>
                                <button class="color-preset" style="background:#7928ca;" data-color="#7928ca" title="Cyberpunk Purple"></button>
                                <button class="color-preset" style="background:#ff5e62;" data-color="#ff5e62" title="Sunset Orange"></button>
                                <button class="color-preset" style="background:#00b09b;" data-color="#00b09b" title="Emerald Green"></button>
                                <button class="color-preset" style="background:#ff007f;" data-color="#ff007f" title="Neon Pink"></button>
                                <input type="color" id="customColorPicker" value="#2c6bff" title="Chọn màu tùy ý" />
                                <input type="text" id="customColorHex" placeholder="#HEX" maxlength="7" value="#2c6bff" />
                            </div>
                        </div>
                    </div>
                    <!-- Độ mờ kính -->
                    <div class="setting-item">
                        <div class="setting-icon"><i class="fas fa-eye"></i></div>
                        <div class="setting-content">
                            <label>Độ trong suốt của kính</label>
                            <input type="range" id="glassOpacitySlider" min="0.1" max="0.9" step="0.05" value="0.25" />
                            <span class="range-value" id="glassOpacityValue">0.25</span>
                        </div>
                    </div>
                    <!-- Độ mờ ảnh nền -->
                    <div class="setting-item">
                        <div class="setting-icon"><i class="fas fa-blur"></i></div>
                        <div class="setting-content">
                            <label>Độ mờ ảnh nền (Blur)</label>
                            <input type="range" id="bgBlurSlider" min="0" max="20" step="1" value="8" />
                            <span class="range-value" id="bgBlurValue">8</span>
                        </div>
                    </div>
                    <!-- Dark/Light mode -->
                    <div class="setting-item">
                        <div class="setting-icon"><i class="fas fa-moon"></i></div>
                        <div class="setting-content">
                            <label>Chế độ kính</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="darkModeToggle" checked />
                                <label for="darkModeToggle" class="toggle-label"></label>
                                <span class="mode-label" id="modeLabel">Tối</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Nhóm KẾT NỐI -->
                <div class="settings-group">
                    <div class="group-title">KẾT NỐI</div>
                    <!-- MQTT Broker -->
                    <div class="setting-item">
                        <div class="setting-icon"><i class="fas fa-wifi"></i></div>
                        <div class="setting-content">
                            <label>MQTT Broker</label>
                            <div class="mqtt-fields">
                                <input type="text" id="mqttHost" placeholder="Host" value="broker.hivemq.com" />
                                <input type="text" id="mqttPort" placeholder="Port" value="1883" />
                                <input type="text" id="mqttUser" placeholder="Username" />
                                <input type="password" id="mqttPass" placeholder="Password" />
                            </div>
                            <button id="mqttSaveBtn" class="settings-btn">Lưu &amp; Kết nối</button>
                            <div class="connection-status">
                                <span id="connLed" class="led led-green"></span>
                                <span id="connStatusText">Đã kết nối</span>
                                <span id="connPing" style="margin-left:10px;font-size:12px;color:#4a5a7a;">Ping: 12 ms</span>
                            </div>
                        </div>
                    </div>
                    <!-- Tần suất cập nhật -->
                    <div class="setting-item">
                        <div class="setting-icon"><i class="fas fa-sync-alt"></i></div>
                        <div class="setting-content">
                            <label>Tần suất cập nhật</label>
                            <select id="refreshRate">
                                <option value="2000">2 giây</option>
                                <option value="5000" selected>5 giây</option>
                                <option value="10000">10 giây</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Nhóm ÂM THANH -->
                <div class="settings-group">
                    <div class="group-title">ÂM THANH</div>
                    <div class="setting-item">
                        <div class="setting-icon"><i class="fas fa-volume-up"></i></div>
                        <div class="setting-content">
                            <label>Âm thanh nút bấm</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="soundToggle" checked />
                                <label for="soundToggle" class="toggle-label"></label>
                            </div>
                        </div>
                    </div>
                    <div class="setting-item">
                        <div class="setting-icon"><i class="fas fa-microphone-alt"></i></div>
                        <div class="setting-content">
                            <label>Phản hồi giọng nói</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="voiceFeedbackToggle" checked />
                                <label for="voiceFeedbackToggle" class="toggle-label"></label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Nhóm QUẢN LÝ -->
                <div class="settings-group">
                    <div class="group-title">QUẢN LÝ</div>
                    <div class="setting-item">
                        <div class="setting-icon"><i class="fas fa-undo-alt"></i></div>
                        <div class="setting-content">
                            <label>Khôi phục cài đặt gốc</label>
                            <button id="resetBtn" class="settings-btn reset-btn">Reset</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript riêng -->
    <script src="script.js"></script>
</body>
</html>
