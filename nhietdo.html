<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeKit – Nhiệt độ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #d4e6ff, #b8cff0);
            padding: 20px 20px 100px;
            display: flex;
            justify-content: center;
            background-size: cover;
            background-position: center;
            transition: background 0.5s;
        }
        :root {
            --primary-color: #2c6bff;
            --glass-opacity: 0.25;
            --glass-blur: 18px;
        }
        body.dark-mode .app-container,
        body.dark-mode .header h1,
        body.dark-mode .section-title,
        body.dark-mode .gauge-label,
        body.dark-mode .gauge-temp,
        body.dark-mode .footer-note,
        body.dark-mode .nav-item {
            color: #ffffff !important;
        }
        body.dark-mode .gauge-item {
            background: rgba(0,0,0,0.3);
        }
        .app-container {
            max-width: 1200px; width: 100%;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(var(--glass-blur, 18px));
            border-radius: 56px;
            padding: 30px 28px 35px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 0 0 1px rgba(255,255,255,0.4) inset;
        }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; }
        .header h1 { font-size: 32px; font-weight: 700; color: #1c2a4a; }
        .header-actions { font-size: 22px; color: #2c3e6b; cursor: pointer; }
        .section-title { font-size: 20px; font-weight: 600; color: #1c2a4a; margin: 20px 0 14px 6px; }

        .gauge-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .gauge-item {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 18px 10px 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .gauge-item:hover { transform: translateY(-4px); background: rgba(255,255,255,0.35); }
        .gauge-svg { width: 100px; height: 100px; transform: rotate(-90deg); }
        .gauge-bg { fill: none; stroke: rgba(200,200,210,0.3); stroke-width: 8; }
        .gauge-progress { fill: none; stroke: var(--primary-color); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.3s, stroke 0.5s; filter: drop-shadow(0 0 6px currentColor); }
        .gauge-label { font-size: 16px; font-weight: 600; color: #1c2a4a; margin-top: 8px; }
        .gauge-temp { font-size: 24px; font-weight: 700; color: #1c2a4a; }
        .gauge-temp .unit { font-size: 16px; font-weight: 400; color: #4a5a7a; }

        .chart-container {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .chart-container canvas { width: 100% !important; height: auto !important; max-height: 200px; }

        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            z-index: 1000;
            display: flex;
            gap: 8px;
            user-select: none;
            min-width: 300px;
            justify-content: center;
        }
        .nav-item {
            background: transparent;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 500;
            color: #1c2a4a;
            transition: 0.2s;
            background: rgba(255,255,255,0.1);
            text-decoration: none;
        }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 14px; }
        .nav-item:hover { background: rgba(255,255,255,0.2); }
        .nav-item.active { color: var(--primary-color); }

        @media (max-width: 768px) {
            .gauge-grid { grid-template-columns: repeat(3, 1fr); }
            .bottom-nav { min-width: unset; padding: 8px 12px; gap: 4px; }
            .nav-item { padding: 8px 12px; font-size: 14px; }
            .nav-item span { display: none; }
            .nav-item i { font-size: 22px; }
        }
        @media (max-width: 480px) {
            .gauge-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .footer-note { margin-top: 30px; text-align: center; font-size: 13px; color: #4a5a7a; opacity: 0.7; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 18px; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <h1>🌡️ Nhiệt độ</h1>
        <div class="header-actions"><i class="fas fa-sync-alt" id="refreshBtn"></i></div>
    </header>

    <section>
        <h2 class="section-title">Các khu vực</h2>
        <div class="gauge-grid" id="gaugeGrid"></div>
    </section>

    <section class="chart-container">
        <h2 class="section-title" style="margin-top:0;">Xu hướng nhiệt độ</h2>
        <canvas id="trendChart" width="800" height="200"></canvas>
    </section>

    <div class="footer-note"><i class="fas fa-thermometer-half"></i> Dữ liệu cập nhật mỗi 5 giây</div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Trang chủ</span></a>
    <a href="nhietdo.html" class="nav-item active"><i class="fas fa-thermometer-half"></i><span>Nhiệt độ</span></a>
    <a href="kichban.html" class="nav-item"><i class="fas fa-magic"></i><span>Kịch bản</span></a>
    <a href="troly.html" class="nav-item"><i class="fas fa-microphone"></i><span>Trợ lý</span></a>
    <a href="caidat.html" class="nav-item"><i class="fas fa-cog"></i><span>Cài đặt</span></a>
</nav>

<script>
(function() {
    'use strict';

    const tempData = [
        { label: 'Phòng khách', value: 24 },
        { label: 'Phòng ngủ 1', value: 22 },
        { label: 'Phòng ngủ 2', value: 23 },
        { label: 'Nhà bếp', value: 26 },
        { label: 'Ngoài trời', value: 20 }
    ];

    function loadSettings() {
        const primary = localStorage.getItem('primaryColor');
        if (primary) document.documentElement.style.setProperty('--primary-color', primary);
        const glassOpacity = localStorage.getItem('glassOpacity');
        if (glassOpacity) document.documentElement.style.setProperty('--glass-opacity', glassOpacity);
        const glassBlur = localStorage.getItem('glassBlur');
        if (glassBlur) document.documentElement.style.setProperty('--glass-blur', glassBlur + 'px');
        const bg = localStorage.getItem('bgImage');
        if (bg) {
            document.body.style.backgroundImage = `url(${bg})`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
        }
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            document.body.style.background = '#1a1a2e';
            document.querySelector('.app-container').style.background = 'rgba(0,0,0,0.4)';
        } else {
            document.body.classList.remove('dark-mode');
        }
    }
    loadSettings();

    const gaugeGrid = document.getElementById('gaugeGrid');
    const circumference = 2 * Math.PI * 48;

    function renderGauges() {
        gaugeGrid.innerHTML = '';
        tempData.forEach((item, idx) => {
            const container = document.createElement('div');
            container.className = 'gauge-item';

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 120 120');
            svg.classList.add('gauge-svg');

            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            bg.setAttribute('cx', '60'); bg.setAttribute('cy', '60'); bg.setAttribute('r', '48');
            bg.classList.add('gauge-bg');

            const progress = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            progress.setAttribute('cx', '60'); progress.setAttribute('cy', '60'); progress.setAttribute('r', '48');
            progress.classList.add('gauge-progress');
            progress.style.strokeDasharray = circumference;
            progress.style.strokeDashoffset = circumference;

            svg.appendChild(bg);
            svg.appendChild(progress);

            const label = document.createElement('div');
            label.className = 'gauge-label';
            label.textContent = item.label;

            const tempDisplay = document.createElement('div');
            tempDisplay.className = 'gauge-temp';
            tempDisplay.innerHTML = `0<span class="unit">°C</span>`;

            container.appendChild(svg);
            container.appendChild(label);
            container.appendChild(tempDisplay);

            container._progress = progress;
            container._tempDisplay = tempDisplay;
            container._target = item.value;
            container._circumference = circumference;

            gaugeGrid.appendChild(container);
        });
        animateGauges();
    }

    function animateGauges() {
        const items = gaugeGrid.querySelectorAll('.gauge-item');
        items.forEach((el, idx) => {
            const target = tempData[idx].value;
            const progress = el._progress;
            const tempDisplay = el._tempDisplay;
            const circ = el._circumference;
            let current = 0;
            const step = Math.max(1, target / 60);
            const interval = setInterval(() => {
                current += step;
                if (current >= target) {
                    current = target;
                    clearInterval(interval);
                }
                const offset = circ - (current / 100) * circ;
                progress.style.strokeDashoffset = offset;
                tempDisplay.innerHTML = `${Math.round(current)}<span class="unit">°C</span>`;
                let color;
                if (current < 20) color = '#00f2fe';
                else if (current < 30) color = '#38ef7d';
                else if (current < 36) color = '#f5a623';
                else color = '#ff0844';
                progress.style.stroke = color;
            }, 20);
        });
    }

    renderGauges();

    const canvas = document.getElementById('trendChart');
    const ctx = canvas.getContext('2d');
    function drawChart() {
        const width = canvas.parentElement.clientWidth - 40;
        const height = 200;
        canvas.width = width * 2;
        canvas.height = height * 2;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(2, 2);

        const hours = Array.from({length: 24}, (_, i) => i);
        const temps = hours.map(h => {
            return 20 + 8 * Math.sin((h - 6) * Math.PI / 12) + (Math.random() - 0.5) * 2;
        });

        const padding = { top: 20, bottom: 30, left: 30, right: 20 };
        const chartWidth = width - padding.left - padding.right;
        const chartHeight = height - padding.top - padding.bottom;

        const minTemp = Math.min(...temps) - 2;
        const maxTemp = Math.max(...temps) + 2;

        ctx.clearRect(0, 0, width, height);

        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < 5; i++) {
            const y = padding.top + (chartHeight / 5) * i;
            ctx.beginPath();
            ctx.moveTo(padding.left, y);
            ctx.lineTo(width - padding.right, y);
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim() || '#2c6bff';
        ctx.lineWidth = 3;
        ctx.shadowColor = 'rgba(0,0,0,0.1)';
        ctx.shadowBlur = 10;

        temps.forEach((t, i) => {
            const x = padding.left + (i / (temps.length - 1)) * chartWidth;
            const y = padding.top + chartHeight - ((t - minTemp) / (maxTemp - minTemp)) * chartHeight;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();

        temps.forEach((t, i) => {
            const x = padding.left + (i / (temps.length - 1)) * chartWidth;
            const y = padding.top + chartHeight - ((t - minTemp) / (maxTemp - minTemp)) * chartHeight;
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim() || '#2c6bff';
            ctx.lineWidth = 2;
            ctx.stroke();
        });

        ctx.fillStyle = '#4a5a7a';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        for (let i = 0; i < 6; i++) {
            const idx = Math.floor((i / 5) * (temps.length - 1));
            const x = padding.left + (idx / (temps.length - 1)) * chartWidth;
            ctx.fillText(idx + 'h', x, height - 5);
        }

        ctx.textAlign = 'right';
        for (let i = 0; i < 5; i++) {
            const val = minTemp + (maxTemp - minTemp) * (1 - i / 4);
            const y = padding.top + (chartHeight / 4) * i;
            ctx.fillText(Math.round(val) + '°C', padding.left - 8, y + 4);
        }
    }
    drawChart();
    window.addEventListener('resize', drawChart);

    document.getElementById('refreshBtn').addEventListener('click', function() {
        this.classList.add('fa-spin');
        setTimeout(() => {
            this.classList.remove('fa-spin');
            tempData.forEach(item => {
                item.value = 18 + Math.floor(Math.random() * 18);
            });
            renderGauges();
            drawChart();
            showToast('Đã cập nhật nhiệt độ');
        }, 600);
    });

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.style.cssText = `
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            color: white; padding: 14px 28px; border-radius: 40px;
            font-size: 16px; font-weight: 500; z-index: 9999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: fadeInDown 0.4s ease;
        `;
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = '0.4s';
            setTimeout(() => toast.remove(), 500);
        }, 2000);
    }

    const style = document.createElement('style');
    style.textContent = `
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    `;
    document.head.appendChild(style);

    setInterval(() => {
        tempData.forEach(item => {
            item.value += (Math.random() - 0.5) * 0.5;
            item.value = Math.max(10, Math.min(40, item.value));
        });
        renderGauges();
        drawChart();
    }, 5000);

})();
</script>
</body>
</html>
