<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeKit – Kịch bản</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #d4e6ff, #b8cff0);
            padding: 20px 20px 100px;
            display: flex;
            justify-content: center;
            background-size: cover;
            background-position: center;
            transition: background 0.5s;
        }
        :root {
            --primary-color: #2c6bff;
            --glass-opacity: 0.25;
            --glass-blur: 18px;
        }
        .app-container {
            max-width: 1200px; width: 100%;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(var(--glass-blur, 18px));
            border-radius: 56px;
            padding: 30px 28px 35px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .header h1 { font-size: 32px; font-weight: 700; color: #1c2a4a; }
        .header-actions { display: flex; gap: 16px; font-size: 22px; color: #2c3e6b; cursor: pointer; }
        .section-title { font-size: 20px; font-weight: 600; color: #1c2a4a; margin: 20px 0 14px 6px; }

        .scene-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .scene-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }
        .scene-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.35); }
        .scene-card .top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .scene-card .top i { font-size: 28px; color: var(--primary-color); }
        .scene-card .top h3 { font-size: 20px; color: #1c2a4a; }
        .scene-card .actions { display: flex; gap: 10px; margin-top: 12px; justify-content: flex-end; }
        .scene-card .actions button {
            background: rgba(255,255,255,0.3);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .scene-card .actions button:hover { background: rgba(255,255,255,0.5); }
        .scene-card .actions .run { background: var(--primary-color); color: white; }
        .scene-card .actions .run:hover { opacity: 0.8; }
        .scene-card .actions .delete { color: #ff4757; }
        .empty-msg { color: #4a5a7a; padding: 30px; text-align: center; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 30px 35px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal h2 { margin-bottom: 20px; color: #1c2a4a; }
        .modal label { display: block; margin: 12px 0 4px; font-weight: 600; color: #2c3e6b; }
        .modal input, .modal select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.6);
            font-size: 16px;
            outline: none;
        }
        .modal input:focus, .modal select:focus { border-color: var(--primary-color); }
        .modal .device-checkboxes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0 12px;
        }
        .modal .device-checkboxes label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            font-size: 14px;
            cursor: pointer;
        }
        .modal .device-checkboxes input[type="checkbox"] {
            width: auto;
            accent-color: var(--primary-color);
        }
        .modal .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .modal .form-actions button {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal .form-actions .btn-save { background: var(--primary-color); color: white; }
        .modal .form-actions .btn-cancel { background: rgba(0,0,0,0.1); color: #1c2a4a; }
        .modal .form-actions button:hover { transform: scale(1.02); }

        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            z-index: 1000;
            display: flex;
            gap: 8px;
            user-select: none;
            min-width: 300px;
            justify-content: center;
        }
        .nav-item {
            background: transparent;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 500;
            color: #1c2a4a;
            transition: 0.2s;
            background: rgba(255,255,255,0.1);
            text-decoration: none;
        }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 14px; }
        .nav-item:hover { background: rgba(255,255,255,0.2); }
        .nav-item.active { color: var(--primary-color); }

        @media (max-width: 768px) {
            .bottom-nav { min-width: unset; padding: 8px 12px; gap: 4px; }
            .nav-item { padding: 8px 12px; font-size: 14px; }
            .nav-item span { display: none; }
            .nav-item i { font-size: 22px; }
            .modal .device-checkboxes { grid-template-columns: 1fr; }
        }
        .footer-note { margin-top: 30px; text-align: center; font-size: 13px; color: #4a5a7a; opacity: 0.7; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 18px; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <h1>🎬 Kịch bản</h1>
        <div class="header-actions">
            <i class="fas fa-plus" id="addSceneBtn" title="Thêm kịch bản"></i>
        </div>
    </header>

    <section>
        <h2 class="section-title">Danh sách kịch bản</h2>
        <div class="scene-list" id="sceneList"></div>
    </section>

    <div class="footer-note"><i class="fas fa-magic"></i> Tự động hóa ngôi nhà của bạn</div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle">Tạo kịch bản mới</h2>
        <form id="sceneForm">
            <label>Tên kịch bản</label>
            <input type="text" id="sceneName" placeholder="Ví dụ: Xem phim" required />

            <label>Biểu tượng</label>
            <input type="text" id="sceneIcon" placeholder="fa-film" value="fa-film" />

            <label>Chọn thiết bị kích hoạt</label>
            <div class="device-checkboxes" id="deviceCheckboxes"></div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" id="modalCancel">Hủy</button>
                <button type="submit" class="btn-save" id="modalSave">Lưu</button>
            </div>
        </form>
    </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Trang chủ</span></a>
    <a href="nhietdo.html" class="nav-item"><i class="fas fa-thermometer-half"></i><span>Nhiệt độ</span></a>
    <a href="kichban.html" class="nav-item active"><i class="fas fa-magic"></i><span>Kịch bản</span></a>
    <a href="troly.html" class="nav-item"><i class="fas fa-microphone"></i><span>Trợ lý</span></a>
    <a href="caidat.html" class="nav-item"><i class="fas fa-cog"></i><span>Cài đặt</span></a>
</nav>

<script>
(function() {
    'use strict';

    // ===== DỮ LIỆU THIẾT BỊ MẪU =====
    const allDevices = [
        { room: 'phong-ngu-1', name: 'Đèn ngủ', type: 'light' },
        { room: 'phong-ngu-1', name: 'Quạt', type: 'fan' },
        { room: 'phong-ngu-2', name: 'Đèn học', type: 'light' },
        { room: 'phong-ngu-2', name: 'Ổ cắm', type: 'plug' },
        { room: 'phong-trung-tam', name: 'Đèn trần', type: 'light' },
        { room: 'phong-trung-tam', name: 'Máy lạnh', type: 'ac' },
        { room: 'phong-trung-tam', name: 'TV', type: 'tv' },
        { room: 'phong-khach', name: 'Đèn chùm', type: 'light' },
        { room: 'phong-khach', name: 'Quạt trần', type: 'fan' },
        { room: 'phong-khach', name: 'Rèm cửa', type: 'curtain' }
    ];

    // ===== LOAD CÀI ĐẶT =====
    function loadSettings() {
        const primary = localStorage.getItem('primaryColor');
        if (primary) document.documentElement.style.setProperty('--primary-color', primary);
        const glassOpacity = localStorage.getItem('glassOpacity');
        if (glassOpacity) document.documentElement.style.setProperty('--glass-opacity', glassOpacity);
        const glassBlur = localStorage.getItem('glassBlur');
        if (glassBlur) document.documentElement.style.setProperty('--glass-blur', glassBlur + 'px');
        const bg = localStorage.getItem('bgImage');
        if (bg) {
            document.body.style.backgroundImage = `url(${bg})`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
        }
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.style.background = '#1a1a2e';
            document.querySelector('.app-container').style.background = 'rgba(0,0,0,0.4)';
        }
    }
    loadSettings();

    // ===== QUẢN LÝ KỊCH BẢN =====
    let scenes = JSON.parse(localStorage.getItem('scenes')) || [];

    function saveScenes() {
        localStorage.setItem('scenes', JSON.stringify(scenes));
        // Kích hoạt sự kiện storage để trang chủ cập nhật
        window.dispatchEvent(new Event('storage'));
    }

    function renderScenes() {
        const container = document.getElementById('sceneList');
        if (scenes.length === 0) {
            container.innerHTML = `<div class="empty-msg">Chưa có kịch bản nào. Nhấn <i class="fas fa-plus"></i> để tạo mới.</div>`;
            return;
        }
        container.innerHTML = '';
        scenes.forEach((scene, index) => {
            const card = document.createElement('div');
            card.className = 'scene-card';
            card.innerHTML = `
                <div class="top">
                    <i class="fas ${scene.icon || 'fa-film'}"></i>
                    <h3>${scene.name}</h3>
                </div>
                <div class="actions">
                    <button class="run" data-index="${index}"><i class="fas fa-play"></i> Chạy</button>
                    <button class="edit" data-index="${index}"><i class="fas fa-edit"></i> Sửa</button>
                    <button class="delete" data-index="${index}"><i class="fas fa-trash"></i></button>
                </div>
            `;
            container.appendChild(card);
        });

        // Sự kiện
        container.querySelectorAll('.run').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                runScene(idx);
            });
        });
        container.querySelectorAll('.edit').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                openEditModal(idx);
            });
        });
        container.querySelectorAll('.delete').forEach(btn => {
            btn.addEventListener('click', function() {
                if (confirm('Bạn có chắc muốn xóa kịch bản này?')) {
                    const idx = parseInt(this.dataset.index);
                    scenes.splice(idx, 1);
                    saveScenes();
                    renderScenes();
                    showToast('Đã xóa kịch bản');
                }
            });
        });
    }

    function runScene(index) {
        const scene = scenes[index];
        if (!scene) return;
        showToast(`✅ Đã chạy kịch bản "${scene.name}"`);
    }

    // ===== MODAL =====
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const sceneName = document.getElementById('sceneName');
    const sceneIcon = document.getElementById('sceneIcon');
    const deviceCheckboxes = document.getElementById('deviceCheckboxes');
    const form = document.getElementById('sceneForm');
    let editingIndex = null;

    function openModal(title, data = null) {
        modalTitle.textContent = title;
        sceneName.value = data ? data.name : '';
        sceneIcon.value = data ? data.icon : 'fa-film';
        deviceCheckboxes.innerHTML = '';
        allDevices.forEach((dev, i) => {
            const checked = data && data.devices && data.devices.some(d => d.name === dev.name && d.room === dev.room);
            const label = document.createElement('label');
            label.innerHTML = `
                <input type="checkbox" value="${i}" ${checked ? 'checked' : ''}>
                ${dev.name} (${dev.room})
            `;
            deviceCheckboxes.appendChild(label);
        });
        modalOverlay.classList.add('active');
        editingIndex = data ? scenes.indexOf(data) : null;
    }

    function closeModal() {
        modalOverlay.classList.remove('active');
        form.reset();
        editingIndex = null;
    }

    document.getElementById('addSceneBtn').addEventListener('click', () => openModal('Tạo kịch bản mới'));
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const name = sceneName.value.trim();
        if (!name) return alert('Vui lòng nhập tên kịch bản');
        const icon = sceneIcon.value.trim() || 'fa-film';
        const selectedCheckboxes = deviceCheckboxes.querySelectorAll('input[type="checkbox"]:checked');
        const devices = [];
        selectedCheckboxes.forEach(cb => {
            const idx = parseInt(cb.value);
            const dev = allDevices[idx];
            devices.push({ name: dev.name, room: dev.room, state: true });
        });
        if (devices.length === 0) return alert('Vui lòng chọn ít nhất một thiết bị');

        const newScene = { name, icon, devices };

        if (editingIndex !== null) {
            scenes[editingIndex] = newScene;
        } else {
            scenes.unshift(newScene); // Thêm vào đầu
        }
        saveScenes();
        renderScenes();
        closeModal();
        showToast(editingIndex !== null ? 'Đã cập nhật kịch bản' : 'Đã thêm kịch bản mới');
    });

    function openEditModal(index) {
        const scene = scenes[index];
        if (scene) openModal('Sửa kịch bản', scene);
    }

    // ===== TOAST =====
    function showToast(msg) {
        const toast = document.createElement('div');
        toast.style.cssText = `
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            color: white; padding: 14px 28px; border-radius: 40px;
            font-size: 16px; font-weight: 500; z-index: 9999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: fadeInDown 0.4s ease;
        `;
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = '0.4s';
            setTimeout(() => toast.remove(), 500);
        }, 2500);
    }

    const style = document.createElement('style');
    style.textContent = `
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    `;
    document.head.appendChild(style);

    renderScenes();

})();
</script>
</body>
</html>
